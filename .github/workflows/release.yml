name: Release

# Push a tag such as v1.0.0 to build the installers on each OS and publish them as a GitHub Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  installers:
    name: Installers for ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            target: --mac
          - name: Windows
            os: windows-latest
            target: --win
          - name: Linux
            os: ubuntu-latest
            target: --linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @openicq/desktop build
      - run: pnpm --filter @openicq/desktop exec electron-builder ${{ matrix.target }} --publish never
        env:
          # No signing certificates: builds are unsigned (macOS ad-hoc), see the README.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v7
        with:
          name: installers-${{ matrix.name }}
          if-no-files-found: error
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb

  publish:
    name: GitHub Release
    needs: installers
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: installers
          merge-multiple: true
      - name: Checksums
        run: cd installers && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" installers/* \
            --title "openICQ $GITHUB_REF_NAME" \
            --notes-file .github/release-notes.md
