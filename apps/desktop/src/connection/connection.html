<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'"
    />
    <title>Connection settings</title>
    <link rel="stylesheet" href="connection.css" />
    <script src="page.js" defer></script>
  </head>
  <body>
    <form id="dialog" novalidate>
      <h1>Connection settings</h1>
      <p class="hint">Choose how openICQ connects.</p>
      <label class="choice">
        <input type="radio" name="mode" id="mode-host" value="host" />
        <span>
          <strong>Host a server on this computer</strong>
          <small>Your chats are stored on this computer.</small>
        </span>
      </label>
      <div class="options" id="host-options">
        <label class="field">
          <span>Port</span>
          <input id="port" type="text" inputmode="numeric" maxlength="5" />
        </label>
        <label class="check">
          <input type="checkbox" id="share" />
          <span>Let other computers on my network connect</span>
        </label>
        <p class="note" id="network-urls" hidden></p>
      </div>
      <label class="choice">
        <input type="radio" name="mode" id="mode-connect" value="connect" />
        <span>
          <strong>Connect to a server</strong>
          <small>A friend's computer or a server on the internet.</small>
        </span>
      </label>
      <div class="options" id="connect-options">
        <label class="field">
          <span>Server address</span>
          <input id="server" type="text" placeholder="192.168.1.20:5190" spellcheck="false" />
        </label>
      </div>
      <p class="problem" id="problem" role="alert" hidden></p>
      <div class="buttons">
        <button type="button" class="secondary" id="cancel">Cancel</button>
        <button type="submit" class="primary" id="ok">Connect</button>
      </div>
      <button type="button" id="close" hidden>Close</button>
    </form>
  </body>
</html>
